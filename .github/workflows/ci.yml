name: App checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:sql
      - run: npm run build
      - run: npm run test:production

  browser-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:behavior
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-behavior
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  browser-visual:
    # Screenshot baselines are recorded on Windows; behavior-only suites share
    # one Linux job and one dependency/browser installation.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:ui:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-visual
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
