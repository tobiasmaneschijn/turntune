name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'staging' && 'https://beta.turntune.app' || 'https://turntune.app' }}
    permissions:
      contents: read
      actions: read
      checks: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Check CI, migrations and deployment target
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          MIGRATION_CHECK_JSON: ${{ vars.MIGRATION_CHECK_JSON }}
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: node scripts/release/preflight.mjs
      - name: Set image tag
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf 'tag=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_BROWSER_PROJECT=${{ vars.SENTRY_BROWSER_PROJECT }}
            SENTRY_SERVER_PROJECT=${{ vars.SENTRY_SERVER_PROJECT }}
            SENTRY_URL=${{ vars.SENTRY_URL }}
            SENTRY_UPLOAD_ENABLED=${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan the image before publishing
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.image.outputs.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          format: table
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the image and record its digest
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/repo-digests.json"
          node scripts/release/image-manifest.mjs "$RUNNER_TEMP/repo-digests.json"
      - name: Deploy and verify ingress
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          MIGRATION_CHECK_JSON: ${{ vars.MIGRATION_CHECK_JSON }}
          DOKPLOY_API_URL: ${{ secrets.DOKPLOY_API_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: node scripts/release/deploy.mjs
