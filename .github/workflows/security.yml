name: Security gates

on:
  push:
    branches: [master, develop]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: node scripts/check-dependencies.mjs --self-test && npm run audit:dependencies
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/security-tools"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/security-tools" gitleaks
          printf '%s\n' "$RUNNER_TEMP/security-tools" >> "$GITHUB_PATH"
      - run: node scripts/check-secrets.mjs --self-test && npm run security:secrets

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install hash-pinned Semgrep CE and dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/semgrep-ce"
          "$RUNNER_TEMP/semgrep-ce/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r security/static-analysis/requirements.txt
      - name: Verify vulnerable, clean and failure paths
        run: '"$RUNNER_TEMP/semgrep-ce/bin/python" security/static-analysis/check.py --self-test --output work/static-analysis-selftest'
      - name: Scan tracked application and build sources with local rules
        run: '"$RUNNER_TEMP/semgrep-ce/bin/python" security/static-analysis/check.py --output work/static-analysis-results'
      - name: Preserve local static analysis reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: static-analysis-reports
          path: |
            work/static-analysis-selftest/
            work/static-analysis-results/
          if-no-files-found: error
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: docker build --build-arg BUILD_REVISION=${{ github.sha }} --tag soundspin:security .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.75.0
          image-ref: soundspin:security
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          format: table
