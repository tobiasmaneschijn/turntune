name: Build release image

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      image:
        description: Published image pinned to its registry digest
        value: ${{ jobs.publish.outputs.image }}
      digest:
        description: Registry digest of the scanned image
        value: ${{ jobs.publish.outputs.digest }}

permissions:
  contents: read
  actions: read

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.ref_type == 'branch' && (github.ref_name == 'develop' || github.ref_name == 'master') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.release.outputs.digest }}
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require successful checks for this commit
        run: node scripts/release/preflight.mjs image
      - name: Set image tag
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf 'tag=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the release image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          build-args: BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan the image before publishing
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.75.0
          image-ref: ${{ steps.image.outputs.tag }}
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          format: table
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned image and record its digest
        id: release
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          docker push "$IMAGE_TAG"
          docker image inspect "$IMAGE_TAG" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/repo-digests.json"
          node scripts/release/image-manifest.mjs "$RUNNER_TEMP/repo-digests.json"
      - name: Save release image metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          overwrite: true
          path: |
            release-image.json
            compose.release.yaml
          if-no-files-found: error
          retention-days: 90
