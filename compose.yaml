services:
  soundspin:
    build: .
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: /app/data
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SIGNUP_INVITE_PASSWORD: ${SIGNUP_INVITE_PASSWORD:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SOUNDCLOUD_CLIENT_ID: ${SOUNDCLOUD_CLIENT_ID:-}
      SOUNDCLOUD_CLIENT_SECRET: ${SOUNDCLOUD_CLIENT_SECRET:-}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-}
      SPOTIFY_MARKET: ${SPOTIFY_MARKET:-US}
      PROVIDER_TOKEN_ENCRYPTION_KEY: ${PROVIDER_TOKEN_ENCRYPTION_KEY:-}
      APPLE_MUSIC_TEAM_ID: ${APPLE_MUSIC_TEAM_ID:-}
      APPLE_MUSIC_KEY_ID: ${APPLE_MUSIC_KEY_ID:-}
      APPLE_MUSIC_PRIVATE_KEY: ${APPLE_MUSIC_PRIVATE_KEY:-}
      APPLE_MUSIC_STOREFRONT: ${APPLE_MUSIC_STOREFRONT:-us}
    volumes:
      - soundspin-data:/app/data
    ports:
      - "3000"

volumes:
  soundspin-data:
